name: Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

  check-version:
    runs-on: ubuntu-24.04
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
      EXISTS: ${{ steps.check_release.outputs.EXISTS }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Extract Cargo.toml Version
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Check Existing Release
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.get_version.outputs.VERSION }}" > /dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [check-version, test]
    if: needs.check-version.outputs.EXISTS == 'false'
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: extras_fetcher
            asset_name: extras_fetcher-linux-x86_64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact_name: extras_fetcher.exe
            asset_name: extras_fetcher-windows-x86_64.exe
          - os: macos-15
            target: aarch64-apple-darwin
            artifact_name: extras_fetcher
            asset_name: extras_fetcher-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compile Executable
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          if-no-files-found: error

  attest:
    needs: [check-version, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - asset_name: extras_fetcher-linux-x86_64
            artifact_name: extras_fetcher
          - asset_name: extras_fetcher-windows-x86_64.exe
            artifact_name: extras_fetcher.exe
          - asset_name: extras_fetcher-macos-aarch64
            artifact_name: extras_fetcher
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: artifact

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: artifact/${{ matrix.artifact_name }}

  publish:
    needs: [check-version, build, attest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          mkdir dist
          mv artifacts/extras_fetcher-linux-x86_64/extras_fetcher dist/extras_fetcher-linux-x86_64
          mv artifacts/extras_fetcher-windows-x86_64.exe/extras_fetcher.exe dist/extras_fetcher-windows-x86_64.exe
          mv artifacts/extras_fetcher-macos-aarch64/extras_fetcher dist/extras_fetcher-macos-aarch64

      - name: Publish Release and Upload Binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.VERSION }}
        run: |
          gh release create "v$VERSION" \
            dist/extras_fetcher-linux-x86_64 \
            dist/extras_fetcher-windows-x86_64.exe \
            dist/extras_fetcher-macos-aarch64 \
            --title "v$VERSION" \
            --generate-notes
